name: sat-ingest-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pillow
      - run: SAT_OUT=/tmp/sat_tiles python tools/sat_ingest.py
      - run: |
          mkdir -p data/sat; cp /tmp/sat_tiles/ingest_report.json data/sat/ingest_report.json
          du -sh /tmp/sat_tiles/* | tee data/sat/ingest_sizes.txt
          git config user.name "metstat-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/sat; git commit -m "sat-ingest-test report" || echo none
          git pull --rebase origin main; git push origin HEAD:main
