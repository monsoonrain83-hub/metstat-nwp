name: apply-bundle
# هر فایل bundle_*.zip که در ریشهٔ مخزن آپلود شود: باز می‌شود، فایل‌ها جایگزین می‌شوند، zip حذف و commit می‌شود.
# امن‌سازی: مسیر مطلق/".."/پوشهٔ .github و .git رد می‌شود؛ فقط پسوندهای مجاز؛ بعد از باز کردن، سینتکس .py و obs_test.py بررسی می‌شود و
# اگر خطایی بود هیچ commitی انجام نمی‌شود (zip می‌ماند). فایل RUN_AFTER.txt داخل zip = فهرست workflowهایی که بعد از commit اجرا شوند.
on:
  push:
    branches: [main]
    paths: ["bundle_*.zip"]
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: apply-bundle
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: extract bundles
        run: |
          shopt -s nullglob
          ls bundle_*.zip >/dev/null 2>&1 || { echo "no bundle"; exit 0; }
          python - <<'PY'
          import glob, os, stat, sys, zipfile
          from pathlib import PurePosixPath
          OK = {".py", ".csv", ".json", ".md", ".txt", ".yml", ".yaml", ".php"}
          files = {}
          total = 0
          for z in sorted(glob.glob("bundle_*.zip")):
              with zipfile.ZipFile(z) as zf:
                  for i in zf.infolist():
                      n = i.filename
                      if i.is_dir(): continue
                      parts = n.split("/")
                      mode = (i.external_attr >> 16) & 0o170000
                      if (not n or "\\" in n or any(c.isspace() or ord(c)<32 for c in n)
                          or any(p in ("", ".", "..") or p.startswith(".") for p in parts)
                          or ":" in n or mode not in (0, stat.S_IFREG)
                          or os.path.splitext(n)[1].lower() not in OK
                          or i.file_size > 30 * 1024 * 1024
                          or n in files or n == "nwp_upload.php"):
                          raise SystemExit("Unsafe, duplicate or protected bundle entry: " + repr(n))
                      total += i.file_size
                      if total > 120 * 1024 * 1024 or len(files) >= 2000:
                          raise SystemExit("Bundle size/count limit exceeded")
                      p = PurePosixPath(n)
                      if any(os.path.islink(str(q)) for q in (p, *p.parents)):
                          raise SystemExit("Symlink path rejected")
                      files[n] = zf.read(i)
          for n, data in files.items():
              os.makedirs(os.path.dirname(n) or ".", exist_ok=True)
              with open(n, "wb") as f: f.write(data)
          print("extracted", len(files), "files")
          open("/tmp/applied.txt", "w").write("\n".join(files))
          PY
      - name: validate (syntax + obs tests)
        run: |
          shopt -s nullglob
          for f in $(grep -E '\.py$' /tmp/applied.txt 2>/dev/null); do python -m py_compile "$f" || { echo "SYNTAX ERROR in $f — nothing committed"; exit 1; }; done
          if [ -f obs_test.py ]; then python obs_test.py; fi
          for f in $(grep -E '\.php$' /tmp/applied.txt 2>/dev/null); do php -l "$f"; done
      - name: commit and push
        run: |
          shopt -s nullglob
          [ -s /tmp/applied.txt ] || { echo "nothing applied"; exit 0; }
          RA=""; [ -f RUN_AFTER.txt ] && RA="$(cat RUN_AFTER.txt)" && rm -f RUN_AFTER.txt
          git rm -q --ignore-unmatch bundle_*.zip
          git config user.name apply-bot; git config user.email apply-bot@users.noreply.github.com
          git add -A; git commit -m "apply bundle ($(wc -l < /tmp/applied.txt) files)"
          git push || { echo "Push rejected; rebuild and revalidate on latest main"; exit 1; }
          for wf in $RA; do echo "$wf" | grep -Eq '^[a-z0-9_.-]+\.yml$' && gh workflow run "$wf" --ref main && echo "dispatched $wf"; done
        env:
          GH_TOKEN: ${{ github.token }}
