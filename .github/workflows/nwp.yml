name: metstat-nwp
# r115: کار بین چند job موازی تقسیم شده است (هر job یک runner جدا با ۴ هسته).
# قبلاً هر ۸ مدل + مالتی‌مدل در یک runner و یک پروسس پایتون می‌ساختند؛ هر نقشه ≈ ۷ ثانیه و ران‌ها هیچ‌وقت کامل نمی‌شدند.
on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch: {}
concurrency:
  group: nwp
  cancel-in-progress: false
env:
  NWP_UP_WORKERS: "1"      # هر job یک رشتهٔ آپلود؛ با ۱۵ job همزمان، فشار روی هاست از ۱۵ اتصال بیشتر نمی‌شود
  NWP_UP_GAP: "0.4"
jobs:
  maps:
    name: ${{ matrix.m }} ${{ matrix.s }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        include:
          - { m: ecmwf,  s: "0/3" }
          - { m: ecmwf,  s: "1/3" }
          - { m: ecmwf,  s: "2/3" }
          - { m: ecmwf9, s: "0/1" }
          - { m: gfs,    s: "0/2" }
          - { m: gfs,    s: "1/2" }
          - { m: gfs25,  s: "0/2" }
          - { m: gfs25,  s: "1/2" }
          - { m: icon,   s: "0/2" }
          - { m: icon,   s: "1/2" }
          - { m: ukmo,   s: "0/1" }
          - { m: gem,    s: "0/1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: probe
        continue-on-error: true
        run: python nwp_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --probe --models ${{ matrix.m }}
      - name: maps
        # r190: خودترمیم — اگر پروسس بمیرد/هاست موقتاً قطع شود، بعد از ۲ دقیقه با زمان باقی‌ماندهٔ بودجه دوباره بالا می‌آید (قبلاً job تا ۶ ساعت بعد مرده می‌ماند)
        run: |
          END=$((SECONDS+19800))   # بودجهٔ ۳۳۰ دقیقه؛ سقف job = ۳۵۸
          rc=1
          while :; do
            LEFT=$(( (END-SECONDS)/60 - 14 )); [ "$LEFT" -lt 10 ] && break
            python nwp_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --loop --max-minutes "$LEFT" --models ${{ matrix.m }} --shard ${{ matrix.s }} --mm-ext; rc=$?
            [ "$rc" -eq 0 ] && break
            echo "::warning::exit $rc — restart in 120s"; sleep 120
          done
          exit $rc

  mm:
    # مالتی‌مدل: فقط میدان‌ها را از همهٔ مدل‌ها می‌خواند (بدون ساخت نقشهٔ تک‌مدل) و نقشهٔ ترکیبی می‌سازد؛ سه سهم موازی
    name: multimodel ${{ matrix.s }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        s: ["0/3", "1/3", "2/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: multimodel
        run: |
          END=$((SECONDS+19800)); rc=1
          while :; do
            LEFT=$(( (END-SECONDS)/60 - 14 )); [ "$LEFT" -lt 10 ] && break
            python nwp_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --loop --max-minutes "$LEFT" --models ecmwf9,ecmwf,gfs,gfs25,icon,gem,ukmo --regions iran,fars,me --mm mmcache --mm-only --shard ${{ matrix.s }}; rc=$?
            [ "$rc" -eq 0 ] && break
            echo "::warning::exit $rc — restart in 120s"; sleep 120
          done
          exit $rc

  chain:
    # r190: زنجیرهٔ بی‌وقفه — بلافاصله پس از پایان این ران (موفق یا ناموفق) ران بعدی صف می‌شود؛ cron و watchdog فقط پشتیبان‌اند
    needs: [maps, mm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nwp.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
