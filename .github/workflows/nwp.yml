name: metstat-nwp
# r115: کار بین چند job موازی تقسیم شده است (هر job یک runner جدا با ۴ هسته).
# قبلاً هر ۸ مدل + مالتی‌مدل در یک runner و یک پروسس پایتون می‌ساختند؛ هر نقشه ≈ ۷ ثانیه و ران‌ها هیچ‌وقت کامل نمی‌شدند.
on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch: {}
concurrency:
  group: nwp
  cancel-in-progress: false
env:
  NWP_UP_WORKERS: "1"      # هر job یک رشتهٔ آپلود؛ با ۱۵ job همزمان، فشار روی هاست از ۱۵ اتصال بیشتر نمی‌شود
  NWP_UP_GAP: "0.4"
jobs:
  maps:
    name: ${{ matrix.m }} ${{ matrix.s }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        include:
          - { m: ecmwf,  s: "0/3" }
          - { m: ecmwf,  s: "1/3" }
          - { m: ecmwf,  s: "2/3" }
          - { m: ecmwf9, s: "0/1" }
          - { m: gfs,    s: "0/2" }
          - { m: gfs,    s: "1/2" }
          - { m: gfs25,  s: "0/2" }
          - { m: gfs25,  s: "1/2" }
          - { m: icon,   s: "0/2" }
          - { m: icon,   s: "1/2" }
          - { m: ukmo,   s: "0/1" }
          - { m: gem,    s: "0/1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: probe
        continue-on-error: true
        run: python nwp_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --probe --models ${{ matrix.m }}
      - name: maps
        # r190: خودترمیم — اگر پروسس بمیرد/هاست موقتاً قطع شود، بعد از ۲ دقیقه با زمان باقی‌ماندهٔ بودجه دوباره بالا می‌آید (قبلاً job تا ۶ ساعت بعد مرده می‌ماند)
        run: |
          END=$((SECONDS+19800))   # بودجهٔ ۳۳۰ دقیقه؛ سقف job = ۳۵۸
          rc=1
          while :; do
            LEFT=$(( (END-SECONDS)/60 - 14 )); [ "$LEFT" -lt 10 ] && break
            python nwp_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --loop --max-minutes "$LEFT" --models ${{ matrix.m }} --shard ${{ matrix.s }} --mm-ext; rc=$?
            [ "$rc" -eq 0 ] && break
            echo "::warning::exit $rc — restart in 120s"; sleep 120
          done
          exit $rc


  world:
    # Opt-in, bounded first operational tranche; same workflow and host tree.
    # Enable only after V114+ host uploader and viewer are installed/verified.
    if: ${{ vars.METSTAT_WORLD_ENABLE == '1' }}
    name: world append ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: [ecmwf, gfs, icon, ukmo, gem]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pin existing host run without changing regional state
        env:
          MODEL: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          req=urllib.request.Request('https://wtafkik.ir/online/data/manifest.json',headers={'Cache-Control':'no-cache','Accept-Encoding':'identity'})
          with urllib.request.build_opener(NoRedirect()).open(req,timeout=30) as r:
              b=r.read(32*1024*1024+1)
              if len(b)>32*1024*1024:raise ValueError('manifest too large')
          m=json.loads(b)
          run=m['models'][os.environ['MODEL']]['run']
          dt=datetime.strptime(run,'%Y%m%d%H').replace(tzinfo=timezone.utc)
          assert dt.strftime('%Y%m%d%H')==run
          Path('host-manifest.json').write_bytes(b)
          Path('run-utc.txt').write_text(dt.strftime('%Y-%m-%dT%H:%M:%SZ'))
          PY
      - name: Stage verified two-frame world products of the identical run
        env:
          MODEL: ${{ matrix.model }}
        run: |
          RUN=$(cat run-utc.txt)
          timeout 18m python global_nwp_stage.py --model "$MODEL" --out "stage/world-$MODEL-24" --lead 24 --run-utc "$RUN" --convection
          timeout 18m python global_nwp_stage.py --model "$MODEL" --out "stage/world-$MODEL-48" --lead 48 --run-utc "$RUN" --convection
          python pack_world_frames.py stage verified --budget-bytes 134217728
          python publish_world_host.py verified/catalog.json host-manifest.json
      - name: Publish same-run frames and verify public bytes
        env:
          NWP_UPLOAD_KEY: ${{ secrets.MX_KEY }}
        run: |
          timeout 15m python publish_world_host.py verified/catalog.json host-manifest.json --apply

  mm:
    # مالتی‌مدل: فقط میدان‌ها را از همهٔ مدل‌ها می‌خواند (بدون ساخت نقشهٔ تک‌مدل) و نقشهٔ ترکیبی می‌سازد؛ سه سهم موازی
    name: multimodel ${{ matrix.s }}
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      fail-fast: false
      matrix:
        s: ["0/3", "1/3", "2/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: multimodel
        run: |
          END=$((SECONDS+19800)); rc=1
          while :; do
            LEFT=$(( (END-SECONDS)/60 - 14 )); [ "$LEFT" -lt 10 ] && break
            python nwp_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --loop --max-minutes "$LEFT" --models ecmwf9,ecmwf,gfs,gfs25,icon,gem,ukmo --regions iran,fars,me --mm mmcache --mm-only --shard ${{ matrix.s }}; rc=$?
            [ "$rc" -eq 0 ] && break
            echo "::warning::exit $rc — restart in 120s"; sleep 120
          done
          exit $rc

  chain:
    # r190: زنجیرهٔ بی‌وقفه — بلافاصله پس از پایان این ران (موفق یا ناموفق) ران بعدی صف می‌شود؛ cron و watchdog فقط پشتیبان‌اند
    needs: [maps, mm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nwp.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"

  tick:
    # r190: زمان‌بند پشتیبان — cron گیت‌هاب اجراهای ساعتی را گاهی رد می‌کند (بین ۰۵:۱۷ و ۱۳:۰۶ UTC هیچ ران رصد نبود). این job هر ساعت در دقیقهٔ ۲۲ و ۵۲ در صورت نبودن ران رصدِ ≤۳۵ دقیقه‌ای، obs-ingest را راه می‌اندازد
    runs-on: ubuntu-latest
    timeout-minutes: 358
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          END=$((SECONDS+20400)); last=""
          while [ $SECONDS -lt $END ]; do
            m=$(date -u +%M); k=$(date -u +%Y%m%d%H%M)
            if { [ "$m" = "22" ] || [ "$m" = "52" ]; } && [ "$k" != "$last" ]; then
              last=$k
              recent=$(gh run list --repo "$GITHUB_REPOSITORY" -w obs-ingest.yml -L 5 --json createdAt -q '[.[]|select((now - (.createdAt|fromdateiso8601)) < 2100)]|length' || echo 0)
              [ "$recent" = "0" ] && gh workflow run obs-ingest.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "dispatched obs-ingest $k"
            fi
            sleep 20
          done
