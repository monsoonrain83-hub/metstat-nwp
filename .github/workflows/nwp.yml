name: metstat-nwp
on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch: {}
concurrency:
  group: nwp
  cancel-in-progress: false
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements.txt
      - name: probe
        continue-on-error: true
        run: python nwp_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --probe
      - name: maps
        # r112: حلقه ۳۲۰ دقیقه + ۱۲ دقیقه فرصت پایانی آپلود = حداکثر ≈ ۳۳۵ دقیقه، پیش از سقف ۳۵۸ دقیقهٔ job (قبلاً ۳۴۰ + آپلودِ گیرکرده → «operation was canceled»)
        run: python nwp_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --loop --max-minutes 320 --mm mmcache
