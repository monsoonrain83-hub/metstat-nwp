name: Observation station publish safety tests
on:
  pull_request:
    paths:
      - 'tools/obs_station_publish.py'
      - 'tests/test_obs_station_publish.py'
      - '.github/workflows/obs-stations.yml'
      - '.github/workflows/obs_station_ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/obs_station_publish.py'
      - 'tests/test_obs_station_publish.py'
      - '.github/workflows/obs-stations.yml'
      - '.github/workflows/obs_station_ci.yml'
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Parse Python and check offline safety invariants
        run: |
          python -m py_compile tools/obs_station_publish.py tests/test_obs_station_publish.py
          python -m unittest discover -s tests -p test_obs_station_publish.py -v
