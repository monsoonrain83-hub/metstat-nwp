name: flood-forecast
on:
  workflow_dispatch:
  schedule:
    - cron: "40 5,17 * * *"
permissions:
  contents: write
jobs:
  fc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python flood_forecast.py
      - run: |
          git config user.name "metstat-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/flood; git commit -m "flood forecast run" || echo none
          git pull --rebase origin main; git push origin HEAD:main
