name: metstat-rrqpe
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"      # هر ۱۰ دقیقه (گیت‌هاب گاهی چند دقیقه دیرتر اجرا می‌کند)
concurrency:
  group: rrqpe
  cancel-in-progress: true
jobs:
  rrqpe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install numpy pillow netCDF4 opencv-python-headless requests
      - name: build rrqpe frames and upload to host
        run: python rrqpe_ingest.py --out rrqpe_out --frames 12 --steps 6 --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}"
