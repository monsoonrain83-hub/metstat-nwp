name: SEAS5 cycle integrity tests
on:
  pull_request:
    paths:
      - 'seas5_maps.py'
      - 'tests/test_seas5_cycle.py'
      - '.github/workflows/seas5_cycle_test.yml'
  push:
    branches: [main]
    paths:
      - 'seas5_maps.py'
      - 'tests/test_seas5_cycle.py'
      - '.github/workflows/seas5_cycle_test.yml'
permissions:
  contents: read
jobs:
  cycle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install import-time dependencies only (no CDS access)
        run: pip install numpy scipy pillow matplotlib requests
      - name: Compile SEAS module and regression tests
        run: python -m py_compile seas5_maps.py tests/test_seas5_cycle.py
      - name: Check already-published and incomplete-cycle behavior
        run: python -m unittest discover -s tests -p 'test_seas5_cycle.py' -v
