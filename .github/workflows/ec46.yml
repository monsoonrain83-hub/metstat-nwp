name: metstat-ec46
on:
  schedule:
    - cron: "40 11 * * *"
  workflow_dispatch:
concurrency:
  group: ec46
  cancel-in-progress: false
jobs:
  ec46:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get update -y && sudo apt-get install -y libeccodes-dev || true
          pip install eccodes s3fs requests numpy scipy pillow matplotlib netCDF4
          python -c "import eccodes; print('eccodes', eccodes.__version__)"
      - name: ec46 maps
        run: python ec46_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}"
