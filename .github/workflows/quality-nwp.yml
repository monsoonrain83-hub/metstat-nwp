name: quality-nwp
# بررسی خودکار مخزن NWP: خطاهای واقعی پایتون (نام تعریف‌نشده/نحو)، و اجرای آزمایشی بدون اینترنت
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}
jobs:
  py:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff bandit numpy scipy pillow requests matplotlib xarray
      - name: "Ruff — فقط خطاهای واقعی (F: نام تعریف‌نشده، E9: نحو)"
        run: ruff check --select F821,F811,F823,E9 .
      - name: "Bandit — فقط شدت بالا"
        run: bandit -q -r . -lll -x ./tests || true
      - name: "اجرای آزمایشی نقشه‌ساز (دادهٔ ساختگی)"
        run: python nwp_maps.py --mock --out out --models icon --max-steps 4 --regions iran
      - name: "ECMWF HRES 9km — test native temperature map nonempty (offline mock)"
        run: |
          python nwp_maps.py --mock --out out9 --models ecmwf9 --max-steps 4 --regions iran
          find out9 -type f -name 't2m_*' -size +0c -print | grep -q .
      - name: "Regression — multimodel policy and preservation of pending fields"
        run: python -m unittest discover -s tests -p 'test_mm_*.py' -v
      - name: "ARPEGE Middle East product scope (offline)"
        run: python -m unittest discover -s tests -p 'test_arpege_scope.py' -v
      - name: "ERA5 regional temperature climatology regression (offline)"
        run: python -m unittest discover -s tests -p 'test_era5_clim.py' -v
      - name: "ERA5 spatial coordinate collision regression (offline)"
        run: python -m unittest discover -s tests -p 'test_era5_spatial_coords.py' -v
      - name: "ERA5 calendar and regional sampling regression (offline)"
        run: python -m unittest discover -s tests -p 'test_era5_sampling.py' -v
      - name: "Regional ERA5 T2m anomaly reference and missing-data gating"
        run: python -m unittest discover -s tests -p 'test_regional_tanom_era5.py' -v
      - name: "Weekly MM smoke — only matched ECMWF/CFS periods"
        run: |
          python wk_maps.py --mock --out /tmp/metstat-wk-test --only ecwk,cfswk
          find /tmp/metstat-wk-test/mmwk -type f -name 'wta_*.webp' -size +0c -print | grep -q .
          find /tmp/metstat-wk-test/mmwk -type f -name 'wpa_*.webp' -size +0c -print | grep -q .
      - name: "Monthly MM smoke — real-source gating via mock only"
        run: |
          python monthly_mm_maps.py --mock --out /tmp/metstat-mo-test
          find /tmp/metstat-mo-test/mmmo -type f -name 'lrta_*.webp' -size +0c -print | grep -q .
          find /tmp/metstat-mo-test/mmmo -type f -name 'lrpa_*.webp' -size +0c -print | grep -q .
      - name: "SEAS5 mock — monthly and seasonal 500hPa anomaly publication"
        run: |
          python seas5_maps.py --mock --out /tmp/metstat-seas5-test
          find /tmp/metstat-seas5-test/ecmwfseas -type f -name 'lz5a_*.webp' -size +0c -print | grep -q .
          find /tmp/metstat-seas5-test/ecmwfseass -type f -name 'lz5a_*.webp' -size +0c -print | grep -q .
      - name: "نشت کلید"
        run: |
          if grep -rInE "(upload_key|relay_secret|api[_-]?key)[\"' ]*[:=][\"' ]*[A-Za-z0-9_\-]{16,}" --include=*.py --include=*.yml --include=*.php .; then echo "کلید در سورس دیده شد"; exit 1; fi
