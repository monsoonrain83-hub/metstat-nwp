name: obs-stations
on: { workflow_dispatch: {}, schedule: [{ cron: "17 3 * * 1" }] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python obs_stations.py
      - run: |
          git config user.name obs-bot; git config user.email obs-bot@users.noreply.github.com
          git add data/obs/stations.json; git commit -m "obs: stations" || exit 0; git push
