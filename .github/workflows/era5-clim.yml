name: era5-clim
# r192: یک‌بار (یا هنگام نیاز) اقلیم ERA5 (Z500/700/850 و MSLP) را از WeatherBench2 می‌سازد و در data/static می‌گذارد
on: workflow_dispatch
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install xarray zarr gcsfs numpy dask
      - run: python era5_clim.py
      - run: |
          git config user.name era5-bot; git config user.email era5-bot@users.noreply.github.com
          git add data/static/era5_clim_1deg.npz; git commit -m "era5: climatology (WeatherBench2 1990-2019)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
