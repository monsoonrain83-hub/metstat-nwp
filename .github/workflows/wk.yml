name: metstat-weekly-iri
on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch:
concurrency:
  group: wk
  cancel-in-progress: false
jobs:
  wk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get update -y && sudo apt-get install -y libeccodes-dev || true
          pip install eccodes s3fs requests numpy scipy pillow matplotlib netCDF4
      - name: weekly anomalies + IRI seasonal
        # Keep the two optional anomaly products off until a real API/hindcast
        # check and scientific map QC pass. Once verified, the normal daily
        # schedule publishes them automatically with existing model products.
        env:
          WEEKLY_ANOMALY_FLAGS: ${{ vars.METSTAT_WEEKLY_ANOMALY_VERIFIED == 'yes' && '--ec-mslp --cfs-z500' || '' }}
        run: python wk_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" $WEEKLY_ANOMALY_FLAGS
