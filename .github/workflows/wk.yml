name: metstat-weekly-iri
on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch:
concurrency:
  group: wk
  cancel-in-progress: false
jobs:
  wk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get update -y && sudo apt-get install -y libeccodes-dev || true
          pip install eccodes s3fs requests numpy scipy pillow matplotlib netCDF4
      - name: weekly anomalies + IRI seasonal
        run: python wk_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}"
