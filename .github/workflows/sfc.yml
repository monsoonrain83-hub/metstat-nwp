name: metstat-sfc
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 5 1,15 * *"      # روز ۱ و ۱۵ هر ماه میلادی
concurrency:
  group: sfc
jobs:
  sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install numpy xarray netCDF4 cdsapi requests cfgrib eccodes
      - name: build sfc_idx.json + era5_iran.json
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python sfc_build.py --out sfc_out
      - name: keep previous era5 if new one was not built
        run: test -s sfc_out/era5_iran.json || curl -fsS --max-time 60 -o sfc_out/era5_iran.json https://wtafkik.ir/online/data/sfc/era5_iran.json || rm -f sfc_out/era5_iran.json
      - name: check output
        run: test -s sfc_out/sfc_idx.json && ls -la sfc_out
      - uses: actions/upload-artifact@v4
        with:
          name: sfc-json
          path: sfc_out/*.json
      - name: upload to host (nwp_upload.php)
        env:
          MX_HOST: ${{ secrets.MX_HOST }}
          MX_KEY: ${{ secrets.MX_KEY }}
        run: |
          host="${MX_HOST%/}"; ok=0; fail=0
          for f in sfc_out/*.json; do
            n=$(basename "$f")
            code=$(curl -sS -m 180 -o /tmp/r.txt -w "%{http_code}" -X POST --data-binary @"$f" "$host/nwp_upload.php?a=sfput&name=$n&key=$MX_KEY")
            echo "$n -> $code $(head -c 120 /tmp/r.txt)"
            if [ "$code" = "200" ]; then ok=$((ok+1)); else fail=$((fail+1)); fi
          done
          echo "uploaded=$ok failed=$fail"; test $ok -gt 0 && test $fail -eq 0
