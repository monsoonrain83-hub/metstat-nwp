name: metstat-grid-pack
# بستهٔ شبکه‌ای ECMWF (Open Data) و GFS برای سینرژی/جبهه (r66: + متغیرهای سطحی و GFS). اجرا هر ۶ ساعت.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "گام‌ها (مثلاً 0-72/6)"
        default: "0-72/6"
  schedule:
    - cron: "50 7,13,19,1 * * *"
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-dev
      - run: pip install ecmwf-opendata eccodes numpy requests
      - run: python test_grid_derive.py && python test_grid_pack.py
      - run: python grid_pack.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --steps "${{ github.event.inputs.steps || '0-72/6' }}"

      - name: GFS
        continue-on-error: true
        run: python grid_pack.py --model gfs --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}" --steps "${{ github.event.inputs.steps || '0-72/6' }}"
