name: MetStat optional actual-world ICON UKMO probe
on:
  workflow_dispatch: {}
  push:
    branches: [feature/opt-in-world-icon-ukmo-20261123]
    paths:
      - global_nwp_stage.py
      - test_world_extra_catalog.py
      - .github/workflows/world-icon-ukmo-probe.yml
permissions:
  contents: read
jobs:
  real-world:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: [icon, ukmo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verified source readers
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "omfiles[fsspec]" s3fs
      - name: Validate global grids and model provenance
        run: python -m unittest -v test_global_nwp_stage test_world_extra_catalog
      - name: Read actual full-world source with no regional fallback
        run: python global_nwp_stage.py --model "${{ matrix.model }}" --out "artifacts/${{ matrix.model }}" --lead 24
      - name: Retain genuine rasters for human review; never modify live site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: probe-world-${{ matrix.model }}-${{ github.run_number }}
          path: artifacts/${{ matrix.model }}/
          if-no-files-found: error
          retention-days: 7
