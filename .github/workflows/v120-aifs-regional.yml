name: V120 actual AIFS first regional products
on:
  push:
    branches: [fix/v102-same-cycle-anomaly-contract]
    paths: [.github/workflows/v120-aifs-regional.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Verify official native orography and generate genuine maps
        run: |
          python - <<'PY'
          import json,urllib.request
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          from aifs_regional_stage import stage
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          req=urllib.request.Request('https://wtafkik.ir/online/data/manifest.json',headers={'Cache-Control':'no-cache','Accept-Encoding':'identity'})
          with urllib.request.build_opener(NoRedirect()).open(req,timeout=30) as r:
              b=r.read(32*1024*1024+1)
          if len(b)>32*1024*1024:raise ValueError('manifest too large')
          m=json.loads(b)
          run=(datetime.now(timezone.utc)-timedelta(hours=12)).replace(minute=0,second=0,microsecond=0)
          run=run.replace(hour=run.hour//12*12)
          report=stage(Path('stage'),m,run)
          print(json.dumps(report))
          PY
      - name: Check every generated actual map and canonical destination
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          root=Path('stage');r=json.loads((root/'aifs-stage.json').read_text())
          assert r['mock'] is False and r['region']=='me' and r['model']=='aifs'
          assert {(x['param'],x['lead']) for x in r['frames']}=={(p,h) for p in ('p24','pacc','t2m') for h in (24,48)}
          for f in r['frames']:
              path=root/'aifs'/r['run']/f['file']
              assert path.resolve().is_relative_to(root.resolve()) and hashlib.sha256(path.read_bytes()).hexdigest()==f['sha256']
              with Image.open(path) as i:
                  assert i.format=='WEBP' and i.size==(1440,960);i.load()
          print('All six actual AIFS maps decoded and verified; staging only')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v120-aifs-regional
          path: stage/
          retention-days: 7
          if-no-files-found: error
