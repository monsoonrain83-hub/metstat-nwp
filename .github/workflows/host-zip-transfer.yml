name: Temporary host ZIP transfer

on:
  push:
    branches:
      - security-hardening-review
    paths:
      - .github/workflows/host-zip-transfer.yml

permissions:
  contents: read

jobs:
  package-host-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out only the source archive from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          sparse-checkout: host.zip
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify the expected archive
        shell: bash
        run: |
          set -euo pipefail
          test -f host.zip
          test "$(stat -c '%s' host.zip)" = "5229888"
          echo "469c13217e278aa5b441fe371d9abd89c19c3494  host.zip" | sha1sum --check -

      - name: Upload archive as a short-lived artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-zip-transfer
          path: host.zip
          if-no-files-found: error
          retention-days: 1
