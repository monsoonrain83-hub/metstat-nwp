name: metstat-navgem
on:
  schedule:
    - cron: "40 5,11,17,23 * * *"
  workflow_dispatch:
concurrency:
  group: navgem
  cancel-in-progress: false
jobs:
  navgem:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get update -y && sudo apt-get install -y libeccodes-dev || true
          pip install eccodes s3fs requests numpy scipy pillow matplotlib netCDF4
      - name: NAVGEM maps
        run: python navgem_maps.py --host "${{ secrets.MX_HOST }}" --key "${{ secrets.MX_KEY }}"
