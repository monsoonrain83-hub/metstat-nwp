name: MetStat real global NWP raster stage
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [global_nwp_stage.py, test_global_nwp_stage.py, pack_global_products.py, host/assets/world_country_bounds.json, .github/workflows/global-nwp-stage.yml]
  schedule:
    - cron: "15 2,8,14,20 * * *"
permissions:
  contents: read
concurrency:
  group: global-nwp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  world:
    name: World ${{ matrix.model }} native raster
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: [gfs, ecmwf, gem]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real source readers
        run: |
          pip install -r requirements.txt
          pip install "omfiles[fsspec]" s3fs
      - name: Unit and orientation checks
        run: python -m unittest test_global_nwp_stage -v
      - name: Fetch actual full-globe model fields and render
        run: python global_nwp_stage.py --model "${{ matrix.model }}" --out "global_artifacts/${{ matrix.model }}" --lead 24
      - name: Archive real products and manifest (not fake placeholders)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: world-${{ matrix.model }}-${{ github.run_number }}
          path: global_artifacts/${{ matrix.model }}/
          if-no-files-found: error
          retention-days: 7
  publish-world-data:
    name: Publish verified world images and bounds to stable public data branch
    needs: [world]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: world-*
          path: /tmp/metstat-world-downloads
      - name: Verify real rasters and produce stable catalog
        run: |
          python pack_global_products.py /tmp/metstat-world-downloads /tmp/metstat-world-build/world
          cp host/assets/world_country_bounds.json /tmp/metstat-world-build/world/country_bounds.json
      - name: Provide cPanel copy-ready world data bundle and Natural Earth bounds
        uses: actions/upload-artifact@v4
        with:
          name: world-site-data-${{ github.run_number }}
          path: /tmp/metstat-world-build/world/
          if-no-files-found: error
          retention-days: 7
      - name: Push ONLY to world-data branch, never modify website or main
        run: |
          git config user.name "metstat-world-bot"
          git config user.email "metstat-world-bot@users.noreply.github.com"
          git fetch origin world-data || true
          if git show-ref --verify --quiet refs/remotes/origin/world-data; then
            git switch -C world-data origin/world-data
          else
            git switch -c world-data
          fi
          rm -rf world
          cp -a /tmp/metstat-world-build/world ./world
          git add world
          if ! git diff --cached --quiet; then
            git commit -m "data: global GFS ECMWF GEM actual raster run ${{ github.run_number }}"
            git push origin HEAD:world-data
          fi
